esphome:
  name: wepir-1
  friendly_name: WePir 1

esp8266:
  board: esp01_1m

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key:

ota:
  - platform: esphome
    password:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  manual_ip:
    static_ip: 192.168.1.161
    gateway: 192.168.1.1
    subnet: 255.255.255.0

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Wepir-1 Fallback Hotspot"
    password:

binary_sensor:
  platform: gpio
  pin: 13
  name: "PIR Sensor"
  device_class: motion

captive_portal:
